name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DMG
        run: bash scripts/build_mac_dmg.sh
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: IndependenceDay-macOS
          path: dist/IndependenceDay-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows ZIP
        shell: bash
        run: bash scripts/build_windows.sh
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IndependenceDay-Windows
          path: dist/IndependenceDay-Windows.zip

  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IndependenceDay-macOS/IndependenceDay-macOS.dmg
            IndependenceDay-Windows/IndependenceDay-Windows.zip
